apply plugin: 'com.android.application'

Properties properties = new Properties()
properties.load(project.rootProject.file('local.properties').newDataInputStream())

android {
    compileSdk 37

    defaultConfig {
        applicationId "be.submanifold.pentelive"
        minSdkVersion 26
        targetSdkVersion 37
        multiDexEnabled true
        ndk {
            moduleName "Ai"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main {
        // This prevents the auto generation of Android.mk
        jniLibs.srcDir 'src/main/libs'
        // This is not necessary unless you have precompiled libraries in your project.
    }

    tasks.register('buildNative', Exec) {
        def ndkDir = properties.getProperty('ndk.dir')
        commandLine "$ndkDir/ndk-build",
                '-C', file('src/main/jni').absolutePath, // Change src/main/jni the relative path to your jni source
                '-j', Runtime.runtime.availableProcessors(),
                'all',
                'NDK_DEBUG=0'
    }

    tasks.register('cleanNative', Exec) {
        def ndkDir = properties.getProperty('ndk.dir')
        commandLine "$ndkDir/ndk-build",
                '-C', file('src/main/jni').absolutePath, // Change src/main/jni the relative path to your jni source
                'clean'
    }

    clean.dependsOn 'cleanNative'

    tasks.withType(JavaCompile).configureEach {
        compileTask -> compileTask.dependsOn buildNative
    }
    bundle {
        density {
            // Different APKs are generated for devices with different screen densities; true by default.
            enableSplit true
        }
        abi {
            // Different APKs are generated for devices with different CPU architectures; true by default.
            enableSplit true
        }
        language {
            // This is disabled so that the App Bundle does NOT split the APK for each language.
            // We're gonna use the same APK for all languages.
            enableSplit false
        }
    }
    packaging {
        jniLibs {
            // Store native libs uncompressed and 16 KB page-aligned in the APK so they
            // load on 16 KB page-size devices (Android 15+).
            useLegacyPackaging false
        }
    }
    namespace 'be.submanifold.pentelive'
    testOptions {
        unitTests {
            // Table's constructor touches android.graphics.Color.parseColor(...) (theme
            // color fields), which the default unit-test android.jar stub throws for
            // ("not mocked"). Test-only; does not affect app runtime behavior. Needed so
            // JVM unit tests can construct a real Table (see LiveTablePassTest).
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation project(':rules')
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-messaging:25.1.3'
    implementation 'net.yslibrary.keyboardvisibilityevent:keyboardvisibilityevent:2.3.0'
    implementation 'com.github.QuadFlask:colorpicker:0.0.13'
//    implementation 'com.google.android.gms:play-services-auth:20.5.0'
//    implementation 'com.google.android.gms:play-services-gcm:17.0.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.github.kobakei:Android-RateThisApp:1.2.0'
    implementation 'com.android.support:multidex:1.0.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.0'
}

// OkHttp 5 publishes com.squareup.okhttp3:okhttp as an Android AAR (okhttp-android) and a JVM
// JAR (okhttp-jvm). The AAR ships the public-suffix list as an APK asset read through a Context
// that an androidx.startup Initializer installs at app start; local JVM unit tests have neither,
// so Cookie.parse(...) with a domain attribute throws "Unable to load PublicSuffixDatabase.list
// resource". Local unit tests resolve the JVM artifact instead (same okhttp3 API and cookie code,
// list bundled as a classpath resource). The app and instrumented tests keep okhttp-android.
configurations.configureEach { configuration ->
    if (configuration.name.endsWith('UnitTestRuntimeClasspath')
            || configuration.name.endsWith('UnitTestCompileClasspath')) {
        configuration.resolutionStrategy.dependencySubstitution {
            substitute module('com.squareup.okhttp3:okhttp') using module('com.squareup.okhttp3:okhttp-jvm:5.5.0') because 'okhttp-android needs an Android Context to load its public-suffix list'
        }
    }
}

apply plugin: 'com.google.gms.google-services'
